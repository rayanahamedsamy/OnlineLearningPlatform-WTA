<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educore-Register Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/adminregistration.css">
</head>
<body>

<div class="page">

  <div class="left">
    <a href="./hompage.html"><img class="logo" src="/commonui/imgs/EducoreLogo.png" alt="EduCore"></a>
    <a class="back" href="/commonui/view/hompage.html4">Back to website</a>
    <h2>Learning is a process not event!</h2>
  </div>


  <div class="right">
    <h1>Register New Admin</h1>
    <p class="have-account">Already have an account? <a href="/commonui/view/login.html">Login</a></p>

    <form action="#" method="post">

      <div class="row">
        <input type="text" name="username" placeholder="Username">
        <input type="text" name="fullname" placeholder="Full Name">
      </div>

      <div class="row">
        <input type="email" name="email" placeholder="Email">
      </div>

      <div class="row">
        <input type="password" name="password" placeholder="Enter your password">
      </div>

      <div class="row">
        <input type="tel" name="phone" placeholder="Phone">
        <input type="text" name="city" placeholder="City">
      </div>

      <div class="row">
        <input type="date" name="dob" title="Date of Birth">
        <div class="box">
          <span>Gender</span>
          <input type="radio" name="gender" id="genderMale" value="Male"><label for="genderMale">Male</label>
          <input type="radio" name="gender" id="genderFemale" value="Female"><label for="genderFemale">Female</label>
        </div>
      </div>

      <div class="row">
        <select name="country" id="country">
          <option value="">Country</option>
          <option value="bangladesh">Bangladesh</option>
          <option value="germany">Germany</option>
          <option value="scotland">Scotland</option>
        </select>
        <select name="accType" id="accType">
          <option value="">Account Type</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="row">
        <input type="text" name="employee_id" placeholder="Employee ID" required>
        <select name="role" required>
          <option value="">Select a role</option>
          <option value="admin">Admin</option>
          <option value="support_admin">Support Admin</option>
        </select>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="#">Terms &amp; Conditions</a></label>
      </div>

      <button type="submit" class="create">Register Admin</button>

    </form>
  </div>

</div>

</body>
</html>
